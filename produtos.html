<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLanche - Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <h2>📦 StockLanche</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="produtos.html" class="ativo">Produtos</a>
            <a href="consulta.html">Consulta</a>
        </nav>

        <a href="index.html" class="sair">Sair</a>
    </aside>

    <main class="conteudo">

        <h1>Cadastro de Produtos</h1>
        <p class="subtitulo">Adicione e gerencie seus produtos</p>

        <section class="card">

            <h2>Novo Produto</h2>

            <form id="produtoForm">

                <div class="grid-form">

                    <div class="form-group">
                        <label for="nome">Nome do Produto</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Ex: Pão de Hambúrguer"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            placeholder="Ex: Pão tradicional para hambúrguer"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="unidade">Unidade de Medida</label>

                        <select id="unidade" required>
                            <option value="">Selecione</option>
                            <option value="unidade">Unidade</option>
                            <option value="kg">Kg</option>
                            <option value="litro">Litro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantidade">Quantidade Inicial</label>
                        <input
                            type="number"
                            id="quantidade"
                            min="0"
                            value="0"
                            required
                        >
                    </div>

                </div>

                <button type="submit" id="btnSalvar" class="btn-salvar">
                    + Salvar Produto
                </button>

                <button type="button" id="btnCancelar" class="btn-cancelar" hidden>
                    Cancelar edição
                </button>

                <p id="mensagemProduto" class="mensagem-sucesso"></p>

            </form>

        </section>

        <section class="card">

            <h2>Produtos Cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Descrição</th>
                            <th>Unidade</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="js/produtos.js"></script>

</body>
</html>
